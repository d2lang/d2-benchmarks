name: Validate and smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Unit tests and corpus validation
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m benchmarks validate
      # Match Puppeteer's upstream CI: let downloaded Chrome use its sandbox's
      # user namespaces on this ephemeral Ubuntu runner. setup.py never changes this.
      - name: Enable Chrome sandbox user namespaces on the CI runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install exact native tools and exercise SVG and PNG output
        run: python3 scripts/setup.py
      - name: Verify configured versions
        run: python3 -m benchmarks doctor
      - name: Real-tool smoke (correctness only, not a performance gate)
        run: >-
          python3 -m benchmarks run
          --fixtures jupyter_aws_eks
          --warmups 0 --repetitions 1
          --bootstrap 100
          --output results/ci-smoke
          --label 'CI smoke only; shared-runner timings are not benchmark results'
      - name: Retain diagnostic logs and smoke renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-tool-smoke
          include-hidden-files: true
          path: |
            .tools/setup.log
            .tools/setup-manifest.json
            .tools/smoke/
            results/ci-smoke/
          retention-days: 14
